# docker-compose for clinical-agent
#
# Phase 2: app + Qdrant. Vector data persists in ./qdrant_storage between
# runs. Re-indexing is idempotent because chunk IDs are content-addressed.
#
# Run the app and Qdrant together:
#     docker compose up -d qdrant
#     docker compose run --rm app python scripts/build_index.py \
#         --qdrant-url http://qdrant:6333
#
# Or run tests in the container:
#     docker compose run --rm app pytest -v

services:
  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: clinical-agent-qdrant
    ports:
      - "6333:6333"   # REST
      - "6334:6334"   # gRPC
    volumes:
      - ./qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build: .
    image: clinical-agent:dev
    container_name: clinical-agent-app
    depends_on:
      qdrant:
        condition: service_healthy
    env_file:
      - .env
    environment:
      QDRANT_URL: http://qdrant:6333
    volumes:
      - ./data:/app/data
      - ./eval_runs:/app/eval_runs
    command: pytest -v
