name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          # qdrant-client enables Phase 2 vector store tests in :memory:
          # mode. We don't install the full [ml] extras (torch etc.) in
          # CI — those tests are gated by CLINICAL_AGENT_ML_TESTS.
          pip install "qdrant-client>=1.9"

      - name: Lint with ruff
        run: ruff check src tests scripts

      - name: Format check with ruff
        run: ruff format --check src tests scripts

      - name: Run pytest
        run: pytest -v --cov=clinical_agent --cov-report=term-missing
